name: CI

on:
  push:
    branches: [main]
    paths: ['relay/**', 'pwa/**', 'site/**', 'desktop/**', '.github/**', 'docs/relay-protocol.md', 'docs/relay-test-vectors.json']
  pull_request:
    branches: [main]
    paths: ['relay/**', 'pwa/**', 'site/**', 'desktop/**', '.github/**', 'docs/relay-protocol.md', 'docs/relay-test-vectors.json']
  workflow_call:
    inputs:
      image:
        description: Build and test the local container image
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  desktop:
    # A relay release only depends on the relay and PWA checks below.
    if: ${{ toJSON(inputs.image) != 'false' }}
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          components: clippy
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          components: clippy
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            relay/pnpm-lock.yaml
            pwa/pnpm-lock.yaml
            site/pnpm-lock.yaml
      - name: Verify source, browsers and optional container
        env:
          # Push/PR have no call inputs; only an explicit false skips the image.
          VERIFY_IMAGE: ${{ toJSON(inputs.image) != 'false' }}
        run: |
          args=(--install-browser)
          if [[ "$VERIFY_IMAGE" == true ]]; then args+=(--image); fi
          node .github/scripts/verify.mjs "${args[@]}"
