name: CI

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'pwa/**'
      - 'site/**'
      - 'desktop/design/tokens/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/site-pages.yml'
      - '.github/workflows/relay-image.yml'
      - '.github/scripts/**'
      - '!.github/scripts/desktop-release*.mjs'
      - 'docs/relay-protocol.md'
      - 'docs/relay-test-vectors.json'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    branches: [main]
    paths:
      - 'relay/**'
      - 'pwa/**'
      - 'site/**'
      - 'desktop/design/tokens/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/site-pages.yml'
      - '.github/workflows/relay-image.yml'
      - '.github/scripts/**'
      - '!.github/scripts/desktop-release*.mjs'
      - 'docs/relay-protocol.md'
      - 'docs/relay-test-vectors.json'
      - 'LICENSE'
      - 'NOTICE'
  workflow_call:
    inputs:
      image:
        description: Build and test the local container image
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          components: clippy
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            relay/pnpm-lock.yaml
            pwa/pnpm-lock.yaml
            site/pnpm-lock.yaml
      - name: Verify source, browsers and optional container
        env:
          # Push/PR have no call inputs; only an explicit false skips the image.
          VERIFY_IMAGE: ${{ toJSON(inputs.image) != 'false' }}
        run: |
          args=(--install-browser)
          if [[ "$VERIFY_IMAGE" == true ]]; then args+=(--image); fi
          node .github/scripts/verify.mjs "${args[@]}"
