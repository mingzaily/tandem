name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/scripts/desktop-release.mjs'
      - '.github/scripts/desktop-release.test.mjs'
      - '.github/scripts/release-version.mjs'
      - '.github/scripts/run.mjs'
  workflow_dispatch:

permissions:
  contents: read

# Keep reservations, builds and publication in order, including retries.
concurrency:
  group: desktop-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test .github/scripts/desktop-release.test.mjs
      - name: Reserve date version for this commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/desktop-release.mjs prepare
  build:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-macos-${{ github.sha }}
          path: release-assets
      - name: Publish complete installation package
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/desktop-release.mjs publish release-assets
