name: Desktop checks and build

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - '.github/scripts/desktop-release.mjs'
      - '.github/scripts/desktop-release.test.mjs'
      - '.github/scripts/release-version.mjs'
      - '.github/scripts/run.mjs'
  workflow_call:
    inputs:
      version:
        description: Date version to package; empty runs checks only
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        description: Private key matching the updater public key
        required: false

permissions:
  contents: read

jobs:
  desktop:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7 # 1.91.0
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop/src-tauri -> target
          cache-on-failure: true
      - name: Verify release tooling and source versions
        run: |
          node --test .github/scripts/desktop-release.test.mjs
          node .github/scripts/desktop-release.mjs check
      - name: Stamp build version
        if: inputs.version != ''
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
        run: node .github/scripts/desktop-release.mjs stamp "$DESKTOP_VERSION"
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - run: pnpm typecheck
        working-directory: desktop
      - run: pnpm test
        working-directory: desktop
      - run: cargo test --locked
        working-directory: desktop/src-tauri
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: desktop/src-tauri
      - name: Build universal macOS DMG and signed update
        if: inputs.version != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Missing TAURI_SIGNING_PRIVATE_KEY secret' >&2; exit 1; }
          pnpm tauri build --target universal-apple-darwin --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":true}}'
        working-directory: desktop
      - name: Verify app version, architectures and ad hoc signature
        if: inputs.version != ''
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
        run: |
          app=desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Tandem.app
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$DESKTOP_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$app/Contents/Info.plist")" = "$DESKTOP_VERSION"
          architectures=" $(lipo -archs "$app/Contents/MacOS/tandem") "
          [[ "$architectures" == *" arm64 "* && "$architectures" == *" x86_64 "* ]]
          codesign --verify --deep --strict "$app"
      - name: Stage installation and update artifacts
        if: inputs.version != ''
        run: |
          mkdir -p release-assets
          bundle=desktop/src-tauri/target/universal-apple-darwin/release/bundle
          cp "$bundle"/dmg/*.dmg release-assets/
          cp "$bundle/macos/Tandem.app.tar.gz" "$bundle/macos/Tandem.app.tar.gz.sig" release-assets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: inputs.version != ''
        with:
          name: desktop-macos-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
