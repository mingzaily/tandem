name: Relay image

on:
  push:
    branches: [main]
    paths:
      - 'relay/**'
      - 'pwa/**'
      - 'desktop/design/tokens/**'
      - 'LICENSE'
      - 'NOTICE'
      - '.github/workflows/relay-image.yml'
      - '.github/workflows/ci.yml'
      - '.github/scripts/relay-release.mjs'
      - '.github/scripts/relay-release.test.mjs'
      - '.github/scripts/release-version.mjs'
      - '.github/scripts/release-notes.mjs'
      - '.github/scripts/verify.mjs'
      - '.github/scripts/run.mjs'
      - '.github/scripts/container-smoke.mjs'
      - '.github/scripts/automation.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      skip: ${{ steps.release.outputs.skip }}
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test .github/scripts/relay-release.test.mjs
      - name: Reserve independent relay date version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_IMAGE: ghcr.io/mingzaily/tandem-relay
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: node .github/scripts/relay-release.mjs prepare
  verify:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.digest == ''
    uses: ./.github/workflows/ci.yml
    with:
      image: false
  image:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Stamp relay binary version
        env:
          RELAY_VERSION: ${{ needs.prepare.outputs.version }}
        run: node .github/scripts/relay-release.mjs stamp "$RELAY_VERSION"
      - run: pnpm --dir relay install --frozen-lockfile && pnpm --dir pwa install --frozen-lockfile
      - run: pnpm --dir pwa exec playwright install --with-deps chrome
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: smoke
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tandem-relay:smoke
          cache-from: type=gha
      - run: node .github/scripts/container-smoke.mjs tandem-relay:smoke
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: publish
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mingzaily/tandem-relay:${{ needs.prepare.outputs.version }}
            ghcr.io/mingzaily/tandem-relay:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: always() && steps.smoke.outcome == 'success'
        run: docker image rm tandem-relay:smoke
  latest:
    needs: [prepare, image]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' && (needs.image.result == 'success' || needs.prepare.outputs.digest != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: relay-latest
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: node .github/scripts/relay-release.mjs --publish
        env:
          RELAY_IMAGE: ghcr.io/mingzaily/tandem-relay
          RELAY_TAG: ${{ needs.prepare.outputs.tag }}
          RELAY_DIGEST: ${{ needs.prepare.outputs.digest || needs.image.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  release:
    needs: [prepare, latest]
    if: ${{ !cancelled() && needs.latest.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Publish relay release notes
        run: node .github/scripts/relay-release.mjs release
        env:
          GH_TOKEN: ${{ github.token }}
          RELAY_IMAGE: ghcr.io/mingzaily/tandem-relay
          RELAY_TAG: ${{ needs.prepare.outputs.tag }}
          TANDEM_RELEASE_NOTES_API_URL: ${{ secrets.TANDEM_RELEASE_NOTES_API_URL }}
          TANDEM_RELEASE_NOTES_API_KEY: ${{ secrets.TANDEM_RELEASE_NOTES_API_KEY }}
          TANDEM_RELEASE_NOTES_MODEL: ${{ secrets.TANDEM_RELEASE_NOTES_MODEL }}
