name: Relay image

on:
  push:
    tags: ['relay-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      image: false
  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm --dir relay install --frozen-lockfile && pnpm --dir pwa install --frozen-lockfile
      - run: pnpm --dir pwa exec playwright install --with-deps chrome
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/mingzaily/tandem-relay
          flavor: latest=false
          tags: |
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/relay-v') }}
            type=sha
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: smoke
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64
          load: true
          tags: tandem-relay:smoke
          cache-from: type=gha
      - run: node .github/scripts/container-smoke.mjs tandem-relay:smoke
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: publish
        with:
          context: .
          file: relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: always() && steps.smoke.outcome == 'success'
        run: docker image rm tandem-relay:smoke
  latest:
    needs: image
    if: startsWith(github.ref, 'refs/tags/relay-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: relay-latest
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: node .github/scripts/relay-release.mjs --publish
        env:
          RELAY_IMAGE: ghcr.io/mingzaily/tandem-relay
          RELAY_TAG: ${{ github.ref_name }}
          RELAY_DIGEST: ${{ needs.image.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
