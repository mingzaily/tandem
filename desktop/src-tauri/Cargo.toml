[package]
name = "tandem"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hkdf = "0.12"
hmac = "0.12"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml_edit = { version = "0.25", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
